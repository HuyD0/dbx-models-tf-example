name: terraform

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars.example"
      - "**/model_defaults.yaml"
      - "**/model_defaults.schema.json"
      - "**/budget_defaults.yaml"
      - "**/budget_defaults.schema.json"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**/model_defaults.yaml"
      - "**/model_defaults.schema.json"
      - "**/budget_defaults.yaml"
      - "**/budget_defaults.schema.json"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write   # required for OIDC
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"

jobs:
  validate:
    name: fmt + validate + lint + scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [account, dbx-dev, dbx-uat]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: validate governance YAML (model_defaults + budget_defaults)
        run: |
          pip install --quiet check-jsonschema
          check-jsonschema \
            --schemafile modules/model-serving/model_defaults.schema.json \
            modules/model-serving/model_defaults.yaml
          check-jsonschema \
            --schemafile environments/account/budget_defaults.schema.json \
            environments/account/budget_defaults.yaml

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # -backend=false: validate/lint/scan need providers and modules, not
      # remote state — so this job runs without any Azure credentials and
      # stays green even when cloud auth is broken. Only `plan` logs in.
      - name: terraform init (no backend)
        working-directory: environments/${{ matrix.env }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: environments/${{ matrix.env }}
        run: terraform validate -no-color

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --recursive --minimum-failure-severity=error

      - name: trivy (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # Requires working Azure OIDC: the sp-terraform-databricks app
  # registration must carry federated identity credentials for this repo
  # (subjects repo:<owner>/<repo>:pull_request and ...:ref:refs/heads/main).
  # Until that exists the job can only fail at login (AADSTS70025), so it
  # is gated behind an explicit opt-in: set the repository variable
  # ENABLE_CI_PLAN=true (Settings → Secrets and variables → Actions →
  # Variables) once the credentials are in place. Unset = skipped.
  plan:
    name: plan-${{ matrix.env }}
    needs: validate
    if: github.event_name == 'pull_request' && vars.ENABLE_CI_PLAN == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dbx-dev, dbx-uat]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        working-directory: environments/${{ matrix.env }}
        env:
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init -input=false

      - name: terraform plan
        working-directory: environments/${{ matrix.env }}
        env:
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # The Databricks provider authenticates with the GitHub Actions OIDC
          # token (ACTIONS_ID_TOKEN_REQUEST_*, available because this workflow
          # requests `id-token: write`) rather than a client secret. Locally the
          # variable defaults to azure-client-secret for scripts/dev-auth.sh.
          TF_VAR_databricks_auth_type: github-oidc-azure
          # Names and CIDRs are defaulted per-env in variables.tf; only these
          # two identifiers are injected, since terraform.tfvars is gitignored.
          TF_VAR_subscription_id:         ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_databricks_account_id:   ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          TF_VAR_metastore_id:            ${{ secrets.DATABRICKS_METASTORE_ID }}
          TF_VAR_deployment_sp_client_id: ${{ secrets.AZURE_CLIENT_ID }}
        run: terraform plan -input=false -no-color
