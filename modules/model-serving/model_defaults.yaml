# ── Model governance source of truth ────────────────────────────────────────
# This file is the SINGLE source of truth for:
#   • allowlisted external (Azure OpenAI / other provider) models
#   • allowlisted Databricks Foundation Model API entities
#   • blocklisted pre-provisioned `databricks-*` system endpoints
#   • default AI Gateway policy (rate limits + guardrails)
#
# Consumed by:
#   • modules/model-serving/main.tf      → preconditions enforce allowlists,
#                                          gateway_defaults become the default
#                                          ai_gateway config on every endpoint.
#   • scripts/apply-ai-gateway.sh        → applies gateway_defaults rate
#                                          limits + inference tables +
#                                          blocklist via REST API.
#
# When adding/removing a model or changing the default policy, edit ONLY
# this file. Never duplicate these lists in tfvars or bash scripts.

# Approved external models (Azure OpenAI deployments or other providers).
# Any endpoint whose `model` is not listed here fails `terraform plan`.
allowed_external_models:
  - gpt-4o
  - gpt-5-mini
  - gpt-5.4
  - text-embedding-ada-002

# Approved Databricks Foundation Model API entities. These are the real
# system.ai.* names exactly as returned by GET /api/2.0/serving-endpoints.
allowed_foundation_entities:
  - system.ai.databricks-claude-sonnet-4-6
  - system.ai.databricks-claude-opus-4-6
  - system.ai.databricks-claude-opus-4-7

# External endpoints created by the module as databricks_model_serving
# resources. Each endpoint gets usage tracking, inference tables, and the
# gateway_defaults rate limits (or the workspace-level override).
#
# Optional per-endpoint fields:
#   provider:        openai (default, Azure AI Foundry via Entra ID) or
#                    anthropic (direct Anthropic API).
#   api_key_secret:  "<scope>/<key>" Databricks secret path holding the
#                    provider API key — required for provider: anthropic.
#                    The secret must already exist in the workspace; the
#                    key value itself never enters Terraform state.
#
#   # Example — Anthropic served directly through the same gateway:
#   # anthropic-claude-sonnet:
#   #   model: claude-sonnet-4-5
#   #   provider: anthropic
#   #   api_key_secret: llm-provider-keys/anthropic-api-key
#   #   task: llm/v1/chat
#   #   table_prefix: anthropic_claude_sonnet
external_endpoints:
  azure-gpt-4o:
    model: gpt-4o
    deployment_name: gpt-4o
    task: llm/v1/chat
    table_prefix: azure_gpt4o
  azure-gpt-5-mini:
    model: gpt-5-mini
    deployment_name: gpt-5-mini
    task: llm/v1/chat
    table_prefix: azure_gpt5mini
  azure-gpt-5-4:
    model: gpt-5.4
    deployment_name: gpt-5.4
    task: llm/v1/chat
    table_prefix: azure_gpt54
  azure-text-embedding-ada-002:
    model: text-embedding-ada-002
    deployment_name: text-embedding-ada-002
    task: llm/v1/embeddings
    table_prefix: azure_embeddings

# Pre-provisioned Databricks Foundation Model API endpoints to govern in
# place. The `databricks-` name prefix is reserved by Databricks — these
# endpoints exist automatically in every workspace and CANNOT be managed
# with `databricks_model_serving`. Instead, scripts/apply-ai-gateway.sh
# applies rate limits + inference tables via the REST API.
#
# `table_prefix` is the per-endpoint inference table name suffix (prepended
# by the workspace prefix, e.g. team_a_).
foundation_endpoints:
  databricks-claude-sonnet-4-6:
    table_prefix: databricks_claude_sonnet_4_6
  databricks-claude-opus-4-6:
    table_prefix: databricks_claude_opus_4_6
  databricks-claude-opus-4-7:
    table_prefix: databricks_claude_opus_4_7

# Pre-provisioned `databricks-*` endpoints to BLOCK with rate_limit = 0.
# Any request returns HTTP 429 immediately. Usage tracking stays on so
# attempts are still recorded in system.serving.endpoint_usage.
#
# ⚠ This deny-list is FAIL-OPEN: when Databricks rolls out a new
# pre-provisioned endpoint it is fully callable until someone adds it
# here and an apply re-runs the reconciler. Review this list whenever
# Databricks announces new pay-per-token models. (A fail-closed
# alternative — revoking the default EXECUTE on system.ai and granting
# per-model — requires account-team enablement and is out of scope for
# this demo.) allowed_foundation_entities above is audit documentation,
# not enforcement.
disabled_foundation_models:
  - databricks-claude-sonnet-4-5
  - databricks-claude-haiku-4-5
  - databricks-claude-opus-4-5
  - databricks-claude-opus-4-1
  - databricks-claude-sonnet-4
  - databricks-gpt-oss-120b
  - databricks-gpt-oss-20b
  - databricks-qwen3-next-80b-a3b-instruct
  - databricks-qwen35-122b-a10b
  - databricks-llama-4-maverick
  - databricks-gemma-3-12b
  - databricks-gte-large-en
  - databricks-bge-large-en
  - databricks-meta-llama-3-1-8b-instruct
  - databricks-meta-llama-3-3-70b-instruct
  - databricks-meta-llama-3.1-405b-instruct
  - databricks-qwen3-embedding-0-6b

# Default AI Gateway policy applied to every governed endpoint:
#   • Terraform-managed external endpoints use these rate limits unless the
#     workspace overrides them via model_serving_rate_limits, and these
#     guardrails unless overridden via model_serving_guardrails.
#   • scripts/apply-ai-gateway.sh applies the same limits/guardrails to the
#     pre-provisioned `databricks-*` foundation endpoints.
#
# Changing this section re-runs the foundation-endpoint reconciler on the
# next `terraform apply` (the YAML hash is a trigger) and updates every
# Terraform-managed endpoint in place.
#
# Optional knobs (see model_defaults.schema.json for the full shape):
#
#   gateway_defaults:
#     rate_limits:
#       endpoint_tpm: 500000        # tokens/min cap for the whole endpoint
#       user_group_limits:          # per-team caps (max 5)
#         - group: ad-dbx-team-a
#           qpm: 40
#           tpm: 200000
#     guardrails:                   # omit for no guardrails
#       input_safety: true
#       input_pii_behavior: BLOCK   # NONE | BLOCK | MASK
#       output_safety: false
#       output_pii_behavior: NONE
gateway_defaults:
  rate_limits:
    endpoint_qpm: 60  # calls/min across the whole endpoint
    user_qpm: 20      # calls/min per user
